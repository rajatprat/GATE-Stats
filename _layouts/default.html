<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
  </title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      line-height: 1.8;
      color: #263238;
      background: #f4f7fb;
    }

    main {
      max-width: 1050px;
      margin: 45px auto;
      padding: 55px 70px 90px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
    }

    h1, h2, h3 {
      line-height: 1.35;
      color: #123b63;
    }

    h1 {
      font-size: 2.35em;
      margin-top: 1.4em;
      margin-bottom: 0.7em;
      padding-bottom: 14px;
      border-bottom: 3px solid #d9e8f6;
    }

    main > h1:first-child {
      margin-top: 0;
      font-size: 2.7em;
      color: #0d3b66;
      border-bottom: 4px solid #90caf9;
    }

    h2 {
      font-size: 1.85em;
      margin-top: 2em;
      margin-bottom: 0.7em;
      padding-bottom: 10px;
      border-bottom: 2px solid #e2edf7;
    }

    h3 {
      font-size: 1.4em;
      margin-top: 1.7em;
      color: #245b88;
    }

    p {
      margin: 1em 0;
    }

    strong {
      color: #173f5f;
    }

    a {
      color: #1565c0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    hr {
      border: 0;
      height: 2px;
      margin: 50px 0;
      background: #e3ebf3;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      margin: 28px 0;
      overflow: hidden;
      border: 1px solid #d7e2ec;
      border-radius: 12px;
      font-size: 0.95em;
    }

    th {
      background: #eaf4fc;
      color: #123b63;
      font-weight: 700;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #dfe7ee;
      border-right: 1px solid #dfe7ee;
      text-align: left;
    }

    tr:last-child td {
      border-bottom: none;
    }

    th:last-child,
    td:last-child {
      border-right: none;
    }

    tr:nth-child(even) td {
      background: #fafcff;
    }

    ul, ol {
      padding-left: 32px;
    }

    li {
      margin: 9px 0;
    }

    code {
      font-size: 0.92em;
      background: #eef3f7;
      padding: 3px 7px;
      border-radius: 6px;
    }

    /* Display equations */
    mjx-container[display="true"] {
      display: block !important;
      overflow-x: auto;
      overflow-y: hidden;
      margin: 30px 0 !important;
      padding: 22px 18px;
      background: #f5faff;
      border-left: 5px solid #90caf9;
      border-radius: 10px;
      font-size: 1.12em !important;
    }

    /* Inline equations */
    mjx-container:not([display="true"]) {
      font-size: 1.04em !important;
    }

    blockquote {
      margin: 28px 0;
      padding: 18px 24px;
      background: #fffbea;
      border-left: 5px solid #f2c94c;
      border-radius: 8px;
    }

    blockquote p {
      margin: 0;
    }

    /* Make QUICK REVISION visually prominent */
    h1[id*="quick-revision"],
    h2[id*="quick-revision"] {
      margin-top: 55px;
      padding: 20px 24px;
      color: #174d3a;
      background: #eaf8f1;
      border: 0;
      border-left: 6px solid #66b894;
      border-radius: 10px;
    }

    /* Mobile */
    @media (max-width: 800px) {
      body {
        font-size: 18px;
        background: #ffffff;
      }

      main {
        margin: 0;
        padding: 25px 20px 60px;
        border-radius: 0;
        box-shadow: none;
      }

      h1 {
        font-size: 1.9em;
      }

      main > h1:first-child {
        font-size: 2.15em;
      }

      h2 {
        font-size: 1.55em;
      }

      h3 {
        font-size: 1.3em;
      }

      mjx-container[display="true"] {
        padding: 16px 10px;
        font-size: 1em !important;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [
          ['\\(', '\\)'],
          ['$', '$']
        ],
        displayMath: [
          ['\\[', '\\]'],
          ['$$', '$$']
        ]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>

</head>

<body>

  <main>
    {{ content }}
  </main>

</body>

</html>
